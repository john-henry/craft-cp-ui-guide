site_name: Craft CMS CP — UI & Brand Guide
site_description: An unofficial, reverse-engineered reference to the Craft CMS 5.x control-panel UI for plugin & module developers.
site_url: https://john-henry.github.io/craft-cp-ui-guide/
repo_url: https://github.com/john-henry/craft-cp-ui-guide
edit_uri: edit/main/docs/

# Rendered in the footer on every page. Most readers arrive on a component page from search and
# never see the home page, so the "unofficial" disclaimer needs to live here too.
copyright: >
  <a href="https://github.com/john-henry/craft-cp-ui-guide/blob/main/LICENSE">MIT</a> ·
  Craft CMS, its control panel, class names, and design tokens are the property of
  Pixel &amp; Tonic, Inc. This guide documents them and is not affiliated with or endorsed by them.

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/craft-cp.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  # Per-page "last updated" — this guide is a snapshot that drifts from Craft, so the date is
  # real information for a reader. Needs git history: CI already checks out with fetch-depth: 0.
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true

nav:
  - Home: index.md
  - Foundations:
      - Color: foundations/color.md
      - Typography: foundations/type.md
      - Spacing & radius: foundations/space.md
      - Design tokens: foundations/tokens.md
  - Components:
      - Buttons: components/buttons.md
      - The field wrapper: components/field.md
      - Text & textarea: components/text.md
      - Date & time: components/datetime.md
      - Select: components/select.md
      - Selectize: components/selectize.md
      - Autosuggest: components/autosuggest.md
      - Checkbox & radio: components/checkradio.md
      - Lightswitch: components/lightswitch.md
      - Copytext: components/copytext.md
      - Colour & icon pickers: components/pickers.md
      - Status indicators: components/status.md
      - Badges, chips, tokens: components/badges.md
      - Panes & meta: components/panes.md
      - Tables: components/tables.md
      - Vue admin tables: components/vue-admin-table.md
      - Tabs: components/tabs.md
      - Toolbar & search: components/toolbar.md
      - Inner sidebar menus: components/sidebar-nav.md
      - Spinner: components/spinner.md
      - Menus: components/menus.md
      - Modals: components/modals.md
      - Entries & Assets fields: components/relationfields.md
  - Commerce & advanced:
      - Status labels: commerce-and-advanced/status-labels.md
      - Money & price: commerce-and-advanced/money.md
      - Metadata sidebar: commerce-and-advanced/metadata.md
      - Order totals: commerce-and-advanced/totals.md
      - Address card: commerce-and-advanced/address.md
      - Element index: commerce-and-advanced/elindex.md
      - Layout builder elements: commerce-and-advanced/fld.md
  - Reference:
      - Built-in field types: reference/fieldtypes.md
      - Form macros: reference/macros.md
  - Contributing: contributing.md
