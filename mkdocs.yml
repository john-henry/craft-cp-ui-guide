site_name: Craft CMS CP — UI & Brand Guide
site_description: An unofficial, reverse-engineered reference to the Craft CMS 5.x control-panel UI for plugin & module developers.
# site_url: https://YOUR-USERNAME.github.io/craft-cp-guide/
repo_url: https://github.com/YOUR-USERNAME/craft-cp-guide
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/craft-cp.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

nav:
  - Home: index.md
  - Foundations:
      - Color: foundations/color.md
      - Typography: foundations/type.md
      - Spacing & radius: foundations/space.md
      - Design tokens: foundations/tokens.md
  - Components:
      - Buttons: components/buttons.md
      - The field wrapper: components/field.md
      - Text & textarea: components/text.md
      - Select: components/select.md
      - Checkbox & radio: components/checkradio.md
      - Lightswitch: components/lightswitch.md
      - Copytext: components/copytext.md
      - Status indicators: components/status.md
      - Badges, chips, tokens: components/badges.md
      - Panes & meta: components/panes.md
      - Tables: components/tables.md
      - Tabs: components/tabs.md
      - Toolbar & search: components/toolbar.md
      - Inner sidebar menus: components/sidebar-nav.md
      - Spinner: components/spinner.md
      - Modals: components/modals.md
      - Entries & Assets fields: components/relationfields.md
  - Commerce & advanced:
      - Status labels: commerce-and-advanced/status-labels.md
      - Money & price: commerce-and-advanced/money.md
      - Metadata sidebar: commerce-and-advanced/metadata.md
      - Order totals: commerce-and-advanced/totals.md
      - Address card: commerce-and-advanced/address.md
      - Element index: commerce-and-advanced/elindex.md
      - Layout builder elements: commerce-and-advanced/fld.md
  - Reference:
      - Built-in field types: reference/fieldtypes.md
      - Macro reference: reference/macros.md
